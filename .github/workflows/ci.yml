name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q plugins/lilith-dialogue tests

      - name: Validate JSON files
        run: |
          python -m json.tool .agents/plugins/marketplace.json > /dev/null
          python -m json.tool plugins/lilith-dialogue/.codex-plugin/plugin.json > /dev/null
          python -m json.tool plugins/lilith-dialogue/.mcp.json > /dev/null
          python -m json.tool plugins/lilith-dialogue/profile.example.json > /dev/null
